<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz</title><link rel="stylesheet" href="style.css"></head><body><header><b>⚡ QuizMaster <i>PRO</i></b><span id="timer">45</span></header><main class="hero"><small>QUIZ ENGINE</small><h2 id="q">Loading…</h2><div id="opts"></div><button class="btn primary" onclick="next()">Next</button><p id="result"></p></main><script>const token=localStorage.token;if(!token)location.href='student.html';let qs=[],i=0,correct=0,started=Date.now();async function load(){let r=await fetch('/api/questions?amount=20&difficulty=medium&category=computer&topic=Java',{headers:{Authorization:'Bearer '+token}});let d=await r.json();qs=d.questions;show()}function show(){let x=qs[i];q.textContent=(i+1)+'. '+x.question;opts.innerHTML=x.options.map((o,n)=>`<button class="btn" onclick="pick(${n})">${o}</button>`).join('')}function pick(n){let x=qs[i];document.querySelectorAll('#opts button').forEach(b=>b.disabled=true);if(x.options[n]===x.correct)correct++}async function next(){if(i<qs.length-1){i++;show()}else{let r=await fetch('/api/attempts',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({category:'Computer Applications',topic:'Java',difficulty:'medium',total:qs.length,correct,wrong:qs.length-correct,skipped:0})});let d=await r.json();result.textContent=`Score ${correct}/${qs.length} • ${d.percentage}% • Grade ${d.grade}`}}load()</script></body></html>
