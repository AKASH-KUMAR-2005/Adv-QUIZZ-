<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Portal</title><link rel="stylesheet" href="style.css"></head><body><header><b>⚡ QuizMaster <i>PRO</i></b><nav><a href="index.html">Home</a></nav></header><main class="hero"><small>STUDENT ACCOUNT</small><h1>Student Login / Register</h1><p>Register once. Your results are stored centrally in the backend database.</p><input id="name" placeholder="Name"><input id="sid" placeholder="Student ID"><input id="password" type="password" placeholder="Password"><input id="phone" placeholder="Guardian phone (optional)"><input id="email" placeholder="Guardian email (optional)"><br><button class="btn primary" onclick="register()">Register</button><button class="btn" onclick="login()">Login</button><p id="msg"></p></main><script>const API='/api';async function register(){let r=await fetch(API+'/auth/student/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name.value,student_id:sid.value,password:password.value,guardian_phone:phone.value,guardian_email:email.value})});let d=await r.json();if(!r.ok)return msg.textContent=d.error;localStorage.token=d.token;localStorage.user=JSON.stringify(d.user);location.href='quiz.html'}async function login(){let r=await fetch(API+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:sid.value,password:password.value})});let d=await r.json();if(!r.ok)return msg.textContent=d.error;localStorage.token=d.token;localStorage.user=JSON.stringify(d.user);location.href='quiz.html'}</script></body></html>
