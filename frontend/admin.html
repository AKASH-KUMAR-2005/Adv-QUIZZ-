<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><link rel="stylesheet" href="style.css"></head><body><header><b>⚡ QuizMaster <i>PRO</i></b><nav><a href="index.html">Home</a></nav></header><main class="hero"><small>ADMIN DASHBOARD</small><h1>Results</h1><button class="btn primary" onclick="login()">Admin Login</button><div id="out"></div></main><script>let t=localStorage.adminToken;async function login(){let r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:prompt('Username','admin'),password:prompt('Password')})});let d=await r.json();if(!r.ok)return alert(d.error);t=d.token;localStorage.adminToken=t;load()}async function load(){let r=await fetch('/api/admin/overview',{headers:{Authorization:'Bearer '+t}});let d=await r.json();if(!r.ok)return alert(d.error);out.innerHTML=`<p>Attempts: ${d.attempts} • Students: ${d.students} • Average: ${d.average}%</p>`+d.results.map(x=>`<p>${x.name} (${x.student_id}) — ${x.subject}/${x.topic} — ${x.mark} — ${x.percentage}%</p>`).join('')}if(t)load()</script></body></html>
